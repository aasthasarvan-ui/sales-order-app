name: Build EXE with PyInstaller

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pandas openpyxl pytz fpdf2 plotly pyinstaller

    - name: Create launcher script (run.py)
      run: |
        echo import os > run.py
        echo import sys >> run.py
        echo import streamlit.web.cli as stcli >> run.py
        echo def resolve_path(path): >> run.py
        echo     if getattr(sys, 'frozen', False): >> run.py
        echo         return os.path.join(sys._MEIPASS, path) >> run.py
        echo     return os.path.join(os.path.abspath("."), path) >> run.py
        echo if __name__ == "__main__": >> run.py
        echo     app_path = resolve_path("app.py") >> run.py
        echo     sys.argv = ["streamlit", "run", app_path, "--global.developmentMode=false"] >> run.py
        echo     sys.exit(stcli.main()) >> run.py

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="SalesOrderAutomation" --add-data "Output.xlsx;." run.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SalesOrderAutomation-EXE
        path: dist/SalesOrderAutomation.exe
